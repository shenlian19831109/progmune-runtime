server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（favicon / OG 图 / 二维码图等）缓存 1 天
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # favicon.ico 不存在时直接 404，避免被 SPA 兜底塞回 HTML
    location = /favicon.ico {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # HTML 不缓存：每次访问都校验最新版；未知路径兜底到首页（保证 / 正常）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
