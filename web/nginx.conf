server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .md 以 text/markdown 提供（AI 代理内容协商）
    types { text/markdown md; }

    # 静态资源（favicon / OG 图 / 二维码图等）缓存 1 天
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # favicon.ico 不存在时直接 404
    location = /favicon.ico {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # HTML 不缓存：每次访问都校验最新版；未知路径返回 404（AI 代理友好，
    # 不再假 200 兜底——历史兜底导致 sitemap/llms 假 200 的根因）
    location / {
        # markdown 内容协商：仅当请求头带 text/markdown 且不带 text/html 时
        # 才返回 markdown 版（浏览器 Accept 必含 text/html，不会被误伤——
        # 此前单条件曾导致浏览器下载 index.md 的线上事故）
        set $serve_md 0;
        if ($http_accept ~* "text/markdown") { set $serve_md 1; }
        if ($http_accept ~* "text/html") { set $serve_md 0; }
        if ($serve_md = 1) { rewrite ^/$ /index.md break; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
