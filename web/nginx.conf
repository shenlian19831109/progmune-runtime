# markdown 内容协商：仅当 Accept 含 text/markdown 且不含 text/html 时才换
# markdown 版（浏览器 Accept 必含 text/html，不会被误伤——此前单条件曾导致
# 浏览器下载 index.md 的线上事故）
map $http_accept $serve_md {
    "~*text/html" 0;
    "~*text/markdown" 1;
    default 0;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（favicon / OG 图 / 二维码图等）缓存 1 天
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # favicon.ico 不存在时直接 404
    location = /favicon.ico {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # .md 以 text/markdown 提供（AI 代理内容协商用）
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
    }

    # HTML 不缓存：每次访问都校验最新版；未知路径返回 404（AI 代理友好，
    # 不再假 200 兜底——历史兜底导致 sitemap/llms 假 200 的根因）
    location / {
        if ($serve_md = 1) { rewrite ^/$ /index.md last; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
