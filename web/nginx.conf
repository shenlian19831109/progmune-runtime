server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .md 以 text/markdown 提供（AI 代理内容协商）
    types { text/markdown md; }

    # 静态资源（favicon / OG 图 / 二维码图等）缓存 1 天
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # favicon.ico 不存在时直接 404
    location = /favicon.ico {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # HTML 不缓存：每次访问都校验最新版；未知路径返回 404（AI 代理友好，
    # 不再假 200 兜底——历史兜底导致 sitemap/llms 假 200 的根因）
    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^/$ /index.md break;
        }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
