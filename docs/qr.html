<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progmune 用户讨论群</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f8fa;
      color: #1f2328;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { font-size: 14px; color: #57606a; margin: 0 0 20px; }
    .qr-card {
      display: inline-block;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(31, 35, 40, 0.08);
    }
    .qr-card img {
      width: 280px;
      max-width: 78vw;
      border-radius: 4px;
      display: block;
    }
    .hint {
      font-size: 13px;
      color: #57606a;
      margin-top: 16px;
      line-height: 1.7;
    }
    .footer {
      font-size: 12px;
      color: #8c959f;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>Progmune 用户讨论群</h1>
  <p class="sub">意见与建议 · 产品反馈 · 技术交流</p>
  <div class="qr-card">
    <img
      src="https://cdn.jsdelivr.net/gh/shenlian19831109/progmune-runtime@main/assets/wechat-group.png"
      alt="Progmune 用户讨论群二维码（微信）"
    >
  </div>
  <p class="hint">
    长按上方二维码 → 选择「识别图中二维码」加入微信讨论群。<br>
    群码每周更新；若识别失败，请访问
    <a href="https://github.com/shenlian19831109/progmune-runtime/issues">GitHub Issues</a> 留言。
  </p>
  <h2 style="font-size: 18px; margin-top: 28px;">WhatsApp 群</h2>
  <div class="qr-card">
    <img
      src="https://cdn.jsdelivr.net/gh/shenlian19831109/progmune-runtime@main/assets/whatsapp-group.jpg"
      alt="Progmune 用户讨论群二维码（WhatsApp）"
    >
  </div>
  <p class="hint">
    国际用户可扫码加入 WhatsApp 讨论群。
  </p>
  <p class="footer">Progmune — AI Software Verification Infrastructure</p>
</body>
</html>
