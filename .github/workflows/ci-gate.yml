name: CI Gate — Build + Test
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node-version }}' }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Quick smoke test (core only)
        run: npx vitest run src/repair-arch.test.ts tests/decision-engine.test.ts tests/asset-promotion.test.ts --reporter=verbose
