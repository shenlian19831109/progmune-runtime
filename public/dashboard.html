<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progmune 全球免疫网络 - 仪表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f7fa; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
    .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
    .stat-card { background: white; border-radius: 8px; padding: 20px; flex: 1; min-width: 200px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #7f8c8d; text-transform: uppercase; }
    .stat-card .number { font-size: 36px; font-weight: bold; color: #2c3e50; }
    .charts { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
    .chart-box { background: white; border-radius: 8px; padding: 20px; flex: 1; min-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .timeline { background: white; border-radius: 8px; padding: 20px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .timeline-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #ecf0f1; }
    .timeline-item:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 10px; }
    .badge.svl4 { background: #e74c3c; color: white; }
    .badge.svl3 { background: #f39c12; color: white; }
    .badge.svl2 { background: #3498db; color: white; }
    .badge.svl1 { background: #2ecc71; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ Progmune 全球免疫网络 - 仪表板</h1>
    <div class="stats" id="stats"></div>
    <div class="charts">
      <div class="chart-box">
        <h3>高频错误模式 (Top 10)</h3>
        <canvas id="patternChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>SVL 级别分布</h3>
        <canvas id="svlChart"></canvas>
      </div>
    </div>
    <div class="timeline">
      <h3>最近免疫事件</h3>
      <div id="timeline"></div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const resp = await fetch('/api/dashboard');
        const data = await resp.json();
        renderStats(data);
        renderPatternChart(data.topPatterns);
        renderSVLChart(data.topPatterns);
        renderTimeline(data.timeline);
      } catch (e) {
        document.getElementById('stats').innerHTML = '<p style="color:red">加载失败，请检查服务器是否运行。</p>';
      }
    }

    function renderStats(data) {
      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><h3>今日上报</h3><div class="number">${data.todayCount}</div></div>
        <div class="stat-card"><h3>本周上报</h3><div class="number">${data.weekCount}</div></div>
        <div class="stat-card"><h3>总计上报</h3><div class="number">${data.totalCount}</div></div>
      `;
    }

    function renderPatternChart(patterns) {
      const ctx = document.getElementById('patternChart').getContext('2d');
      const labels = patterns.map(p => p.pattern.length > 40 ? p.pattern.substring(0,40)+'...' : p.pattern);
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '出现次数',
            data: patterns.map(p => p.count),
            backgroundColor: 'rgba(231, 76, 60, 0.7)'
          }]
        },
        options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } }
      });
    }

    function renderSVLChart(patterns) {
      const svlCounts = { 'SVL-1': 0, 'SVL-2': 0, 'SVL-3': 0, 'SVL-4': 0 };
      patterns.forEach(p => {
        const svl = p.pattern.split(' | ')[0];
        if (svlCounts[svl] !== undefined) svlCounts[svl] += p.count;
      });
      const ctx = document.getElementById('svlChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['SVL-1 符号错误', 'SVL-2 类型错误', 'SVL-3 数据流错误', 'SVL-4 协议违规'],
          datasets: [{
            data: [svlCounts['SVL-1'], svlCounts['SVL-2'], svlCounts['SVL-3'], svlCounts['SVL-4']],
            backgroundColor: ['#2ecc71', '#3498db', '#f39c12', '#e74c3c']
          }]
        }
      });
    }

    function renderTimeline(timeline) {
      document.getElementById('timeline').innerHTML = timeline.map(t => `
        <div class="timeline-item">
          <span class="badge svl${t.svl ? t.svl.slice(-1) : '1'}">${t.svl || '?'}</span>
          <span style="flex:1">${t.pattern || '(empty)'}</span>
          <span style="color:#7f8c8d; font-size:12px">${t.time}</span>
        </div>
      `).join('');
    }

    loadDashboard();
  </script>
</body>
</html>
